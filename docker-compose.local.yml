services:
  snowind:
    build:
      context: .
      dockerfile: Dockerfile
    image: snowind-ee-unlocked:local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_URL: 'http://localhost:3000'
      APP_SECRET: 'snowind_dev_super_secret_key_2026_change_in_production_abcdef123456789'
      DATABASE_URL: 'postgresql://snowind:snowind_dev_password_2026@db:5432/snowind?schema=public'
      REDIS_URL: 'redis://redis:6379'
      STORAGE_DRIVER: 'local'
      FILE_UPLOAD_SIZE_LIMIT: '50mb'
      MAIL_DRIVER: 'smtp'
      MAIL_FROM_ADDRESS: 'hello@example.com'
      MAIL_FROM_NAME: 'SnoWind'
      SMTP_HOST: '127.0.0.1'
      SMTP_PORT: '587'
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - snowind:/app/data/storage

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snowind
      POSTGRES_USER: snowind
      POSTGRES_PASSWORD: snowind_dev_password_2026
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snowind"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  snowind:
  db_data:
  redis_data:

