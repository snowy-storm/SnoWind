# Local R&D infra only: Postgres + Redis + Typesense.
# App (frontend/backend) still runs on the host with `pnpm dev`.
# Usage: docker compose -f docker-compose.dev.yml up -d --wait
name: snowind-dev

services:
  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: snowind-dev-db
    environment:
      POSTGRES_DB: snowind
      POSTGRES_USER: snowind
      POSTGRES_PASSWORD: "snowind_dev_password_2026!"
    ports:
      - "5444:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snowind -d snowind"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - snowind_db_data:/var/lib/postgresql/data

  redis:
    image: docker.m.daocloud.io/library/redis:7.2-alpine
    container_name: snowind-dev-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "2817:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - snowind_redis_data:/data

  typesense:
    image: typesense/typesense:27.1
    container_name: snowind-dev-typesense
    command: ["--data-dir", "/data", "--api-key", "snowind_typesense_dev_key_2026", "--enable-cors"]
    ports:
      - "8108:8108"
    restart: unless-stopped
    volumes:
      - snowind_typesense_data:/data

volumes:
  snowind_db_data:
  snowind_redis_data:
  snowind_typesense_data:
