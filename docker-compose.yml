# =============================================================================
# SnoWind v0.1.8 — 内网版（intranet / air-gap）
# 仅需本文件即可部署（无需克隆源码、无需单独 .env）
#
# 相对公网版差异：
#   - 自带 Draw.io（阿里云备份镜像），默认 DRAWIO_URL=http://localhost:8089
#   - 已移除 Loom / Airtable / Figma / YouTube 等公网嵌入斜杠插件
#   - 仅保留通用 Iframe（可嵌内网站点）
#   - 全部镜像均来自阿里云 ACR（北京），便于断网/国内拉取
#
# 安装者只需：
#   1. 把本文件放到一个空文件夹里
#   2. 用记事本 / nano / notepad 改下面「请修改」的几处
#   3. 在该文件夹里执行：  docker compose up -d
#
# 浏览器打开：http://本机或服务器IP:3000
# OnlyOffice（Office 预览/编辑）：http://本机或服务器IP:8080
# Draw.io（流程图编辑器）：http://本机或服务器IP:8089
#
# 首次启动会下载镜像，OnlyOffice / Draw.io 体积较大，请耐心等待。
# 完全断网环境请预先 docker pull / docker load 全部镜像。
# =============================================================================

name: snowind

services:
  snowind:
    image: crpi-bn9uffvao1i959pb.cn-beijing.personal.cr.aliyuncs.com/snowind0102/snowind:0.1.8
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
      onlyoffice:
        condition: service_started
      drawio:
        condition: service_started
    environment:
      # 浏览器访问地址。本机试用保持 localhost；
      # 若用服务器 IP 或域名访问，请改成例如 http://192.168.1.10:3000 或 https://wiki.example.com
      APP_URL: "http://localhost:3000"
      PORT: "3000"

      # 【请修改】至少 32 个字符的随机密钥。生产环境务必改掉。
      # Linux 可生成：  openssl rand -hex 32
      APP_SECRET: "ChangeMeToARandomStringAtLeast32CharsLong"

      # 下面数据库密码必须与 db 服务里的 POSTGRES_PASSWORD 完全一致
      DATABASE_URL: "postgresql://snowind:ChangeMeDbPassword2026@db:5432/snowind?schema=public"
      REDIS_URL: "redis://redis:6379"

      STORAGE_DRIVER: local
      MAIL_DRIVER: log
      MAIL_FROM_ADDRESS: hello@example.com
      MAIL_FROM_NAME: SnoWind
      DISABLE_TELEMETRY: "true"

      SEARCH_DRIVER: typesense
      TYPESENSE_URL: http://typesense:8108
      # 【请修改】搜索引擎密钥，须与 typesense 服务的 --api-key 一致
      TYPESENSE_API_KEY: "ChangeMeTypesenseKey2026"
      TYPESENSE_LOCALE: zh

      # 浏览器访问 OnlyOffice 的地址。远程访问时改成 http://服务器IP:8080
      ONLYOFFICE_URL: "http://localhost:8080"
      # 【请修改】须与 onlyoffice 服务的 JWT_SECRET 完全一致（至少 32 字符）
      ONLYOFFICE_JWT_SECRET: "ChangeMeOnlyOfficeJwtSecret32chars"
      # 容器之间互访，一般不用改
      ONLYOFFICE_APP_URL: "http://snowind:3000"

      # 浏览器访问自托管 Draw.io 的地址。远程访问时改成 http://服务器IP:8089
      # 须与下方 drawio 服务的宿主机端口一致（本文件默认 8089）
      DRAWIO_URL: "http://localhost:8089"
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    volumes:
      - snowind_data:/app/data/storage

  db:
    image: crpi-bn9uffvao1i959pb.cn-beijing.personal.cr.aliyuncs.com/snowind0102/postgres:16-alpine
    environment:
      POSTGRES_DB: snowind
      POSTGRES_USER: snowind
      # 【请修改】须与上面 DATABASE_URL 里的密码完全一致
      POSTGRES_PASSWORD: ChangeMeDbPassword2026
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snowind -d snowind"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: crpi-bn9uffvao1i959pb.cn-beijing.personal.cr.aliyuncs.com/snowind0102/redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - redis_data:/data

  typesense:
    image: crpi-bn9uffvao1i959pb.cn-beijing.personal.cr.aliyuncs.com/typesense/typesense:30.1
    command:
      - "--data-dir"
      - "/data"
      - "--api-key"
      - "ChangeMeTypesenseKey2026"
      - "--enable-cors"
    restart: unless-stopped
    volumes:
      - typesense_data:/data

  onlyoffice:
    image: crpi-bn9uffvao1i959pb.cn-beijing.personal.cr.aliyuncs.com/snowind0102/onlyoffice-documentserver:8.3
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ChangeMeOnlyOfficeJwtSecret32chars
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
      USE_UNAUTHORIZED_STORAGE: "true"
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_logs:/var/log/onlyoffice

  # Self-hosted diagrams.net for air-gapped Draw.io editing (no embed.diagrams.net).
  # Browser must reach this URL (same host rule as ONLYOFFICE_URL / DRAWIO_URL).
  drawio:
    image: crpi-bn9uffvao1i959pb.cn-beijing.personal.cr.aliyuncs.com/snowind0102/drawio:30.1.13
    environment:
      # Allow HTTP intranet deployments (no TLS).
      DRAWIO_USE_HTTP: "1"
      # Public URL the browser uses; keep trailing slash. Change with DRAWIO_URL above.
      DRAWIO_SERVER_URL: "http://localhost:8089/"
      DRAWIO_BASE_URL: "http://localhost:8089"
    ports:
      - "8089:8080"
    restart: unless-stopped

volumes:
  snowind_data:
  db_data:
  redis_data:
  typesense_data:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_logs:
