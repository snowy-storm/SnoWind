# SnoWind v0.95.0 — official Docker Compose install
#
# App:        http://localhost:3000
# PostgreSQL: localhost:5435
# Redis:      localhost:6379
#
# Install:
#   1. copy .env.example .env     (Linux/macOS: cp .env.example .env)
#   2. Set APP_SECRET in .env to a random string of at least 32 characters
#   3. docker compose up -d --build
#   4. Open http://localhost:3000 and create the first admin account

name: snowind

services:
  snowind:
    build:
      context: .
      dockerfile: Dockerfile
    image: snowind:0.95.0
    container_name: snowind-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      PORT: "3000"
      APP_SECRET: ${APP_SECRET:-snowind_official_release_secret_change_me_32plus_chars}
      DATABASE_URL: postgresql://${POSTGRES_USER:-snowind}:${POSTGRES_PASSWORD:-snowind_db_change_me_2026}@db:5432/${POSTGRES_DB:-snowind}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      SEARCH_DRIVER: typesense
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-snowind_typesense_change_me_2026}
      TYPESENSE_LOCALE: ${TYPESENSE_LOCALE:-zh}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SnoWind}
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY:-false}
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    volumes:
      - snowind_data:/app/data/storage

  db:
    image: postgres:16-alpine
    container_name: snowind-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snowind}
      POSTGRES_USER: ${POSTGRES_USER:-snowind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snowind_db_change_me_2026}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snowind} -d ${POSTGRES_DB:-snowind}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: snowind-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - redis_data:/data

  typesense:
    image: typesense/typesense:27.1
    container_name: snowind-typesense
    command:
      - "--data-dir"
      - "/data"
      - "--api-key"
      - "${TYPESENSE_API_KEY:-snowind_typesense_change_me_2026}"
      - "--enable-cors"
    restart: unless-stopped
    volumes:
      - typesense_data:/data

volumes:
  snowind_data:
  db_data:
  redis_data:
  typesense_data:
